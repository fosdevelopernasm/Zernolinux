name: Build ZernoOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget cpio squashfs-tools genisoimage

      - name: Clone tinycore-remaster tools
        run: |
          git clone https://github.com/jschlatow/tinycore-remaster.git tools
          cd tools

      - name: Create appliance config and branding for ZernoOS
        run: |
          mkdir -p tools/appliances/zerno
          mkdir -p tools/appliances/zerno/mydata/etc
          mkdir -p tools/appliances/zerno/mydata/opt

          # 1. Конфигурация пакетов (Tiny Core 17.x)
          cat > tools/appliances/zerno/iso.mk << 'EOF'
          BASE_ISO       := Core-17.0.iso
          CORE_GZ        := 17.x/tinycore.gz
          APPS(DOWNLOAD) := 17.x/python3.14 \
                            17.x/nano \
                            17.x/vim \
                            17.x/mc \
                            17.x/openssh \
                            17.x/htop \
                            17.x/git \
                            17.x/curl \
                            17.x/wget
          EOF

          # 2. Замена приветствия в консоли (motd)
          cat > tools/appliances/zerno/mydata/etc/motd << 'EOF'
          =========================================
                   Добро пожаловать в ZernoOS
              Легкая система на базе Tiny Core 17
          =========================================
          Python 3.14 | nano | vim | mc | git | htop
          EOF

          # 3. Установка имени хоста при загрузке
          cat > tools/appliances/zerno/mydata/opt/bootlocal.sh << 'EOF'
          #!/bin/sh
          hostname ZernoOS
          EOF
          chmod +x tools/appliances/zerno/mydata/opt/bootlocal.sh

      - name: Build ZernoOS ISO
        run: |
          cd tools
          make app/zerno

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZernoOS-ISO
          path: tools/build/zerno.iso
